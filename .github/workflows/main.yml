name: run-tests

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    test:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: true
            matrix:
                os: [ubuntu-latest]
                include:
                    - php: 8.4
                      laravel: 12.*
                      testbench: ^10.0
                      stability: prefer-lowest
                    - php: 8.4
                      laravel: 12.*
                      testbench: ^10.0
                      stability: prefer-stable
                    - php: 8.4
                      laravel: 13.*
                      testbench: ^11.0
                      stability: prefer-lowest
                    - php: 8.4
                      laravel: 13.*
                      testbench: ^11.0
                      stability: prefer-stable

        name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
                  coverage: none

            - name: Setup problem matchers
              run: |
                  echo "::add-matcher::${{ runner.tool_cache }}/php.json"
                  echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"
            - name: Install dependencies
              run: |
                  composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
                  # This is a Laravel compatibility matrix. It intentionally resolves
                  # historical framework releases that Composer marks as insecure.
                  # Dependency security is tracked separately from this test matrix.
                  composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-blocking
            - name: Execute tests
              run: vendor/bin/phpunit
